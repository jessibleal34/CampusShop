<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <header class="header-simple">
        <div class="header-simple__container">
            <i data-lucide="arrow-left" class="icon"></i>
            <h1 class="header-simple__title">Historial de Pedidos</h1>
            <div style="width: 24px;"></div>
        </div>
    </header>

    <main class="orders-list">
        <article class="order-card">
            <div class="order-card__main">
                <div class="order-card__info">
                    <h3 class="order-number">Camisa Dama</h3>
                    <span class="order-date">15 abril, 2026</span>
                </div>
                <span class="order-total">$70.000</span>
            </div>
            <div class="order-card__actions">
                <span class="badge badge--delivered">
                    <i data-lucide="check-circle"></i> Entregado
                </span>
                <button class="btn-detail">Ver detalle <i data-lucide="chevron-right"></i></button>
            </div>
        </article>

        <article class="order-card">
            <div class="order-card__main">
                <div class="order-card__info">
                    <h3 class="order-number">Jean Clasico Dama</h3>
                    <span class="order-date">15, abril, 2026</span>
                </div>
                <span class="order-total">$100.000</span>
            </div>
            <div class="order-card__actions">
                <span class="badge badge--shipping">
                    <i data-lucide="truck"></i> En camino
                </span>
                <button class="btn-detail">Ver detalle <i data-lucide="chevron-right"></i></button>
            </div>
        </article>

        <article class="order-card">
            <div class="order-card__main">
                <div class="order-card__info">
                    <h3 class="order-number">Chaqueta de Cuero</h3>
                    <span class="order-date">15, abril, 2026</span>
                </div>
                <span class="order-total">$200.00</span>
            </div>
            <div class="order-card__actions">
                <span class="badge badge--canceled">
                    <i data-lucide="x-circle"></i> pago exitoso, gracias por tu compra
                </span>
                <button class="btn-detail">Ver detalle <i data-lucide="chevron-right"></i></button>
            </div>
        </article>
    </main>

    <nav class="bottom-nav">
        <div class="bottom-nav__item">
            <i data-lucide="home"></i>
            <span>Inicio</span>
        </div>
        <div class="bottom-nav__item">
            <i data-lucide="layout-grid"></i>
            <a href="catalogo.html">
            <span>Catalogo</span>
            </a>
        </div>
        <div class="bottom-nav__item">
            <i data-lucide="shopping-cart"></i>
            <a href="carrito.html">
            <span>Carrito</span>
            </a>
        </div>
        <div class="bottom-nav__item bottom-nav__item--active">
            <i data-lucide="package"></i>
            <a href="index.html">
            <span>CampusShop</span>
            </a>
        </div>
        <div class="bottom-nav__item">
            <i data-lucide="user"></i>
            <a href="perfil.html">
            <span>Perfil</span>
            </a>
        </div>
    </nav>

    <script>lucide.createIcons();</script>
</body>
</html>
