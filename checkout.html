<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CampusShop</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
<header class="header">
  <div class="container nav">
    <span class="icon">☰</span>
    <h1 class="logo">Catalogo</h1>
    <span class="icon">🛒<small class="badge">3</small></span>
  </div>
</header>


    <div class="categories-grid">
      <div class="category-card">
       
        <p>Talla  </p>
      </div>

      <div class="category-card">
        
        <p>Color</p>
      </div>

      <div class="category-card">
       
        <p>Precio</p>
      </div>
    </div>
  </section>
  <section class="products">
    <h2>Novedades para ti</h2>

    <div class="grid">

      <article class="card product">
        <div class="img-container">
          <img src="img/chaqueta.jpeg" alt="Chaqueta de cuero">
          <span class="fav">♡</span>
        </div>
        <h3>Chaqueta de Cuero</h3>
        <p class="price">$120.00</p>
      </article>

      <article class="card product">
        <div class="img-container">
          <img src="img/shirt.jpg" alt="">
          <span class="fav">♡</span>
        </div>
        <h3>Camiseta Gráfica</h3>
        <p class="price">$35.00</p>
      </article>

      <article class="card product">
        <div class="img-container">
          <img src="img/jeans.jpg" alt="">
          <span class="fav">♡</span>
        </div>
        <h3>Jeans Clásicos</h3>
        <p class="price">$75.00</p>
      </article>

      <article class="card product">
        <div class="img-container">
          <img src="img/shoes.jpg" alt="">
          <span class="fav">♡</span>
        </div>
        <h3>Zapatillas Retro</h3>
        <p class="price">$90.00</p>
      </article>

    </div>
  </section>

</main>

</body>
</html>
