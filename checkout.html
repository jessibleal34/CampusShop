<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CampusShop</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
<header class="header-simple">
        <div class="header-simple__container">
            <i data-lucide="arrow-left" class="icon"></i>
            <h1 class="header-simple__title">Checkout</h1>
            <div style="width: 24px;"></div>
        </div>
    </header>

    <main class="checkout-form">
        <section class="form-section">
            <h2 class="section-title">Envío</h2>
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" placeholder="Ingresa tu nombre completo" class="input-text">
            </div>
            <div class="form-group">
                <label>Dirección</label>
                <input type="text" placeholder="Ingresa tu dirección" class="input-text">
            </div>
            <div class="form-group">
                <label>Ciudad</label>
                <input type="text" placeholder="Tu ciudad" class="input-text">
            </div>
        </section>

        <section class="form-section">
            <h2 class="section-title">Método de Pago</h2>
            <div class="payment-methods">
                <div class="payment-card payment-card--active">
                    <i data-lucide="credit-card"></i>
                    <span>Misa</span>
                </div>
                <div class="payment-card">
                    <i data-lucide="credit-card"></i>
                    <span>MasCard</span>
                </div>
                <div class="payment-card">
                    <i data-lucide="wallet"></i>
                    <span>Peypal</span>
                </div>
            </div>
        </section>

        <section class="order-summary-box">
            <h3 class="order-summary-box__title">Resumen de tu Orden</h3>
            
            <div class="summary-item">
                <div class="summary-item__img-box">
                    <img src="shoes.jpg" alt="Zapatillas">
                </div>
                <div class="summary-item__info">
                    <h4>Zapatillas Deportivas</h4>
                    <span>Cantidad: 1</span>
                </div>
                <span class="summary-item__price">$120.00</span>
            </div>

            <div class="summary-item">
                <div class="summary-item__img-box">
                    <img src="headphones.jpg" alt="Auriculares">
                </div>
                <div class="summary-item__info">
                    <h4>Auriculares Premium</h4>
                    <span>Cantidad: 1</span>
                </div>
                <span class="summary-item__price">$99.50</span>
            </div>

            <div class="summary-total">
                <span>Total</span>
                <span>$224.50</span>
            </div>
        </section>
    </main>

    <footer class="footer-action">
        <button class="btn-primary-full">Pagar $224.50</button>
    </footer>

    <script>lucide.createIcons();</script>
</body>
</html>
