<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CampusShop</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<header class="header">
  <div class="container nav">
    <span class="icon">☰</span>
    <h1 class="logo">CampusShop</h1>
    <span class="icon">🛒<small class="badge">3</small></span>
  </div>
</header>

<main class="container">

  <!-- BUSCADOR -->
  <section class="search">
    <input type="text" placeholder="Buscar productos, marcas...">
  </section>

  <!-- CATEGORÍAS -->
  <section class="categories">
    <h2>Categorías Populares</h2>

    <div class="categories-grid">
      <div class="category-card">
        <span>👕</span>
        <p>Abrigos</p>
      </div>

      <div class="category-card">
        <span>👚</span>
        <p>Camisetas</p>
      </div>

      <div class="category-card">
        <span>👖</span>
        <p>Pantalones</p>
      </div>
    </div>
  </section>

  <!-- PRODUCTOS -->
  <section class="products">
    <h2>Novedades para ti</h2>

    <div class="grid">

      <article class="card product">
        <a href="producto.html">
        <div class="img-container">
          <img src="img/chaqueta.jpeg" alt="Chaqueta de cuero">
          <span class="fav">♡</span>
        </div>
        </a>
        <h3>Chaqueta de Cuero</h3>
        <p class="price">$200.000</p>
      </article>

      <article class="card product">
         <a href="producto2.html">
        <div class="img-container">
          <img src="img/Camisa de Mujer.jpg" alt="Camisa Dama">
          <span class="fav">♡</span>
        </div>
        </a>
        <h3>Camisa Dama</h3>
        <p class="price">$70.000</p>
      </article>

      <article class="card product">
         <a href="producto3.html">
        <div class="img-container">
          <img src="img/JeanClasicoMujer.jpg" alt="Jean Clasico Dama">
          <span class="fav">♡</span>
        </div>
         </a>
        <h3>Jeans Clásicos</h3>
        <p class="price">$100.000</p>
      </article>

      <article class="card product">
        <a href="producto4.html">
        <div class="img-container">
          <img src="img/zapatoDama.jpg" alt="">
          <span class="fav">♡</span>
        
        </div>
        </a>

        <h3>Zapatilla Dama</h3>
        <p class="price">$120.000</p>
      </article>

    </div>
  </section>

</main>
<nav class="bottom-nav">
  <div class="bottom-nav__item">
      <i data-lucide="home"></i>
      <a href="Mis favoritos.html">
      <span>FAVORITOS</span>
      </a>
        </div>
        <div class="bottom-nav__item">
            <i data-lucide="layout-grid"></i>
            <a href="catalogo.html">
            <span>Catalogo</span>
            </a>
        </div>
        <div class="bottom-nav__item">
            <i data-lucide="shopping-cart"></i>
            <a href="carrito.html">
            <span>Carrito</span>
            </a>
        </div>
        <div class="bottom-nav__item bottom-nav__item--active">
            <i data-lucide="package"></i>
            <a href="index.html">
            <span>CampusShop</span>
            </a>
        </div>
        <div class="bottom-nav__item">
            <i data-lucide="user"></i>
            <a href="perfil.html">
            <span>Perfil</span>
            </a>
        </div>
    </nav>

    <script>lucide.createIcons();</script>

</body>
</html>
