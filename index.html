<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CampusShop</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<header class="header">
  <div class="container nav">
    <span class="icon">☰</span>
    <h1 class="logo">CampusShop</h1>
    <span class="icon">🛒<small class="badge">3</small></span>
  </div>
</header>

<main class="container">

  <!-- BUSCADOR -->
  <section class="search">
    <input type="text" placeholder="Buscar productos, marcas...">
  </section>

  <!-- CATEGORÍAS -->
  <section class="categories">
    <h2>Categorías Populares</h2>

    <div class="categories-grid">
      <div class="category-card">
        <span>👕</span>
        <p>Abrigos</p>
      </div>

      <div class="category-card">
        <span>👚</span>
        <p>Camisetas</p>
      </div>

      <div class="category-card">
        <span>👖</span>
        <p>Pantalones</p>
      </div>
    </div>
  </section>

  <!-- PRODUCTOS -->
  <section class="products">
    <h2>Novedades para ti</h2>

    <div class="grid">

      <article class="card product">
        <div class="img-container">
          <img src="img/chaqueta.jpeg" alt="Chaqueta de cuero">
          <span class="fav">♡</span>
        </div>
        <h3>Chaqueta de Cuero</h3>
        <p class="price">$200.000</p>
      </article>

      <article class="card product">
        <div class="img-container">
          <img src="img/Camisa de Mujer.jpg" alt="Camisa Dama">
          <span class="fav">♡</span>
        </div>
        <h3>Camisa Dama</h3>
        <p class="price">$70.000</p>
      </article>

      <article class="card product">
        <div class="img-container">
          <img src="img/JeanClasicoMujer.jpg" alt="Jean Clasico Dama">
          <span class="fav">♡</span>
        </div>
        <h3>Jeans Clásicos</h3>
        <p class="price">$100.000</p>
      </article>

      <article class="card product">
        <div class="img-container">
          <img src="img/zapatoDama.jpg" alt="">
          <span class="fav">♡</span>
        </div>
        <h3>Zapatillas Retro</h3>
        <p class="price">$120.000</p>
      </article>

    </div>
  </section>

</main>

</body>
</html>
